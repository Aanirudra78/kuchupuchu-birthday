<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffe6f0" />
  <title>Kuchupuchu · Happy Birthday</title>
  <meta name="description" content="Ek chhota sa birthday surprise — sirf tumhare liye." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="bg-blob bg-blob--a" aria-hidden="true"></div>
  <div class="bg-blob bg-blob--b" aria-hidden="true"></div>
  <div class="bg-blob bg-blob--c" aria-hidden="true"></div>

  <!-- decorative memory wall · only on wide screens -->
  <div class="sidewall" aria-hidden="true">
    <div class="sidewall__col sidewall__col--l">
      <figure class="polaroid" style="--r:-7deg;--d:-1.2s"><img src="assets/photos/single/s01.jpg" alt="" loading="lazy" /></figure>
      <figure class="polaroid" style="--r:5deg;--d:-3.4s"><img src="assets/photos/single/s05.jpg" alt="" loading="lazy" /></figure>
      <figure class="polaroid" style="--r:-4deg;--d:-2.1s"><img src="assets/photos/single/s09.jpg" alt="" loading="lazy" /></figure>
    </div>
    <div class="sidewall__col sidewall__col--r">
      <figure class="polaroid" style="--r:6deg;--d:-2.8s"><img src="assets/photos/double/d02.jpg" alt="" loading="lazy" /></figure>
      <figure class="polaroid" style="--r:-6deg;--d:-0.8s"><img src="assets/photos/double/d06.jpg" alt="" loading="lazy" /></figure>
      <figure class="polaroid" style="--r:4deg;--d:-4.1s"><img src="assets/photos/double/d10.jpg" alt="" loading="lazy" /></figure>
    </div>
  </div>

  <button class="sound-toggle" id="soundToggle" aria-label="Sound on/off" aria-pressed="true">
    <span id="soundIcon">♪</span>
  </button>

  <main class="experience">
    <!-- ================= 1 · DOB ================= -->
    <section class="stage stage--dob is-active" data-stage="dob">
      <div class="dob-card">
        <p class="kicker" id="dobKicker">A LITTLE SOMETHING FOR YOU</p>
        <h1 id="dobTitle">Enter your DOB</h1>
        <p class="sub" id="dobSub">Sahi DOB dalo… phir kuch special hai 💗</p>

        <form id="dobForm" autocomplete="off" novalidate>
          <div class="dob-row">
            <select id="dobDay" aria-label="Day"></select>
            <select id="dobMonth" aria-label="Month"></select>
            <select id="dobYear" aria-label="Year"></select>
          </div>
          <p class="dob-error" id="dobError" hidden></p>
          <button class="btn" type="submit">Enter</button>
        </form>
      </div>
    </section>

    <!-- ================= 2 · REVEAL ================= -->
    <section class="stage stage--reveal" data-stage="reveal">
      <div class="reveal-box">
        <h1 class="reveal-title" id="revealTitle">Ohh, it's your birthday!</h1>
        <p class="reveal-sub" id="revealSub">I think I made something for you…</p>
        <button class="btn reveal-btn" id="revealBtn">Click here</button>
      </div>
    </section>

    <!-- ================= 3 · CAKE ================= -->
    <section class="stage stage--cake" data-stage="cake">
      <div class="cake-box">
        <h2 class="wish-title" id="wishTitle">Make your wish</h2>

        <div class="cake" id="cake" aria-label="Birthday cake">
          <div class="cake__glow" aria-hidden="true"></div>
          <div class="cake__flames" id="candles"></div>
          <div class="cake__tier cake__tier--top"></div>
          <div class="cake__tier cake__tier--mid"></div>
          <div class="cake__tier cake__tier--base"></div>
          <div class="cake__plate"></div>
        </div>

        <button class="btn" id="blowBtn" hidden>Blown the candles</button>
        <button class="btn btn--gift" id="giftBtn" hidden>Gift for you 🎁</button>
      </div>
    </section>

    <!-- ================= 4 · PHOTOS ================= -->
    <section class="stage stage--photos" data-stage="photos">
      <div class="photo-top">
        <span class="photo-label" id="photoLabel">Tum</span>
        <span class="photo-count" id="photoCount">01 / 01</span>
      </div>

      <div class="photo-frame" id="photoFrame">
        <img id="slideA" alt="" />
        <img id="slideB" alt="" />
      </div>

      <div class="photo-progress"><span id="photoBar"></span></div>
    </section>

    <!-- ================= 5 · FINAL ================= -->
    <section class="stage stage--final" data-stage="final">
      <div class="final-box">
        <p class="final-kicker" id="finalKicker">HAPPY BIRTHDAY, MERI JAAN</p>
        <h1 class="final-line1" id="finalLine1">I LOVE YOU</h1>
        <h2 class="final-line2" id="finalLine2">MY BABY GIRL</h2>
        <p class="final-from" id="finalFrom">from Anirudra</p>
        <button class="replay" id="replayBtn">↺ phir se dekho</button>
      </div>
    </section>
  </main>

  <audio id="bgAudio" loop preload="auto"></audio>
  <audio id="rangAudio" preload="auto"></audio>

  <script src="config.js"></script>
  <script src="photos-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
